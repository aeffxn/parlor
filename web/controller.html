<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10110f"><title>Parlor Controller</title><link rel="stylesheet" href="/style.css"></head><body class="controller"><main id="controller-app" class="controller-shell">
<header class="controller-head"><a class="brand" href="/controller.html"><span class="brand-mark">P<span>✳</span></span><span>PARLOR<small>PLAYER CONTROLLER</small></span></a><span id="connection-pill" class="connection-pill"><i></i> CONNECTING</span></header>
<section id="join-view" class="join-view"><div class="controller-kicker">YOUR TURN TO MAKE SOME NOISE</div><h1>Pull up<br>to the <em>Parlor.</em></h1><p>Grab a spot on the couch. Your phone is the controller.</p><form id="join-form"><label for="room-input">ROOM CODE</label><input id="room-input" maxlength="4" autocomplete="one-time-code" placeholder="ABCD" required><label for="name-input">YOUR NAME</label><input id="name-input" maxlength="18" autocomplete="nickname" placeholder="What should we call you?" required><button class="primary-button" type="submit">Join the room <span>↗</span></button><div id="join-error" class="form-error" role="alert"></div></form><div class="join-footnote">Ask your host for the four-letter code.</div></section>
<section id="player-view" class="player-view hidden"><div class="player-greeting"><span class="eyebrow">YOU’RE IN THE ROOM</span><h1 id="player-name">Player</h1><p id="player-status">Waiting for the host to choose a game.</p></div><div id="controller-controls" class="controller-controls"></div></section>
</main><script src="/controller.js" defer></script></body></html>
